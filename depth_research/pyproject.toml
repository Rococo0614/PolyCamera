[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "poldepth-research"
version = "0.1.0"
description = "Reproducible auditing tools for polarization-guided depth enhancement"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "Pillow>=10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

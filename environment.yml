name: poldepth

channels:
  - defaults

dependencies:
  - python=3.11
  - pip
  - pip:
      # CUDA 12.8 is the oldest PyTorch wheel family that supports the
      # RTX 5080 (sm_120). Keep the legacy PPFT CUDA 11 stack out of this env.
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0+cu128
      - torchvision==0.26.0+cu128
      - numpy==2.4.6
      - Pillow==13.0.0
      - opencv-python-headless==5.0.0.93
      - timm==1.0.30
      - tqdm==4.70.1
      - tensorboard==2.21.0
      - tensorboardX==2.6.5
      - h5py==3.16.0
      - matplotlib==3.11.2
      - imageio==2.38.1
      - thop==0.1.1.post2209072238
      - gdown==6.4.2
      - -e ./depth_research

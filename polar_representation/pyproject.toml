[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "polrep-research"
version = "0.1.0"
description = "Auditable pre-training controls for shared polarization representations"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "Pillow>=10.0",
  "scipy>=1.14",
  "scikit-image>=0.24",
]

[project.optional-dependencies]
raw = ["opencv-python>=4.8"]

[tool.setuptools.packages.find]
where = ["src"]
